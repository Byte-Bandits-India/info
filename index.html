    /* Ambient card shine effect on hover */
    .card-shine {
      position: relative;
    }
    .card-shine::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transform: skewX(-20deg);

      pointer-events: none;
    }
    .card-shine:hover::after {

    }
  </style>
